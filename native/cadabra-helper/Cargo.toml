[package]
name = "cadabra-helper"
version = "0.9.7"
license = "MIT"
edition = "2021"
description = "Cadabra OS native helper: mouse hook, UI Automation, capture and input over stdin/stdout JSON-RPC"

[dependencies]
serde_json = "1"
base64 = "0.22"
png = "0.17"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_System_LibraryLoader",
  "Win32_System_Variant",
  "Win32_System_Ole",
  "Win32_Storage_Xps",
  "Win32_Security",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_RemoteDesktop",
  "Win32_System_Shutdown",
  "Win32_UI_Shell",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com_StructuredStorage",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
